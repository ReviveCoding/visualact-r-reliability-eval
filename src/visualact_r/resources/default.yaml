evaluation:
  grounded_required_recall: 0.80
  grounded_max_contamination: 0.70
  bootstrap_iterations: 1000
  min_paired_final_samples: 50

release:
  c5_gas_gain_pp: 3.0
  c5_critical_recall_gain_pp: 3.0
  c5_contamination_tolerance_pp: 2.0
  c5_clean_regression_pp: 1.0
  c6_false_auto_clear_relative_reduction: 0.10
