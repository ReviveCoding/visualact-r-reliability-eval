project:
  name: visualact-r
  schema_version: "0.2"
  seed: 20260626
  task_policy_version: "triage_policy_v1"

data:
  critical_categories: [person, rider, bike, motor, car, truck, bus]
  train_fraction: 0.65
  dev_fraction: 0.15
  calibration_fraction: 0.10
  final_fraction: 0.10
  phash_distance_threshold: 4
  final_hard_minimum: 30
  final_clean_minimum: 30

task_policy:
  primary_zone: [[0.35, 0.45], [0.65, 0.45], [0.90, 1.00], [0.10, 1.00]]
