[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visualact-r"
version = "0.6.5"
description = "Offline grounded visual-agent reliability research framework"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Jinwoo Bae"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "tabulate>=0.9",
  "py7zr>=0.22",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.4",
  "transformers>=4.57.0",
  "peft>=0.14",
  "bitsandbytes>=0.45",
  "accelerate>=1.2",
  "qwen-vl-utils>=0.0.14",
]
vision = ["ultralytics>=8.3"]
dev = ["pytest>=8", "ruff==0.14.0", "mypy>=1.13", "build>=1.2"]
parquet = ["pyarrow>=16"]

[project.scripts]
visualact-r = "visualact_r.cli:main"

[tool.setuptools.package-data]
"visualact_r.resources" = ["*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
# Keep application checks deterministic when optional dependencies ship stubs for a newer Python grammar.
follow_imports = "skip"
no_site_packages = true
