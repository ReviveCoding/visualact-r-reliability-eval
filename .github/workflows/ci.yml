name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-quality:
    name: Linux quality, fixture, and package-install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m compileall -q src
      - run: python -m visualact_r --help
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --no-site-packages src
      - run: python -m pytest -q
      - run: visualact-r fixture-run --output runs/ci_fixture
      - run: visualact-r qualify --run-dir runs/ci_fixture
      - run: python -m build --sdist --wheel --outdir dist
      - run: |
          python -m venv .wheel-venv
          . .wheel-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip check
          python -m visualact_r --help
          python -m visualact_r runtime-provenance --source-root "$GITHUB_WORKSPACE" --output runs/wheel_runtime_provenance.json
          python -m visualact_r write-config --template qwen_qlora --output runs/wheel_qwen_qlora.yaml
          visualact-r fixture-run --output runs/wheel_fixture
          visualact-r qualify --run-dir runs/wheel_fixture
      - run: |
          python -m venv .sdist-venv
          . .sdist-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          python -m pip check
          python -m visualact_r --help
          python -m visualact_r runtime-provenance --source-root "$GITHUB_WORKSPACE" --output runs/sdist_runtime_provenance.json
          visualact-r fixture-run --output runs/sdist_fixture
          visualact-r qualify --run-dir runs/sdist_fixture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-validation-artifacts
          path: |
            runs/ci_fixture
            runs/wheel_fixture
            runs/sdist_fixture
            runs/wheel_runtime_provenance.json
            runs/sdist_runtime_provenance.json
            dist
          if-no-files-found: warn
          retention-days: 14

  windows-fixture:
    name: Windows fixture and package-install smoke
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE\scripts\run_local_bdd_preflight.ps1",
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q src
          python -m visualact_r --help
          ruff check .
          ruff format --check .
          pytest -q
          visualact-r fixture-run --output runs/ci_fixture_windows
          visualact-r qualify --run-dir runs/ci_fixture_windows
          python -m build --sdist --wheel --outdir dist
          $wheel = (Get-ChildItem -Path dist -Filter '*.whl' | Select-Object -First 1).FullName
          $sdist = (Get-ChildItem -Path dist -Filter '*.tar.gz' | Select-Object -First 1).FullName
          if (-not $wheel -or -not $sdist) { throw 'Build did not produce one wheel and one sdist.' }
          python -m venv .wheel-venv
          & .wheel-venv\Scripts\python.exe -m pip install --upgrade pip
          & .wheel-venv\Scripts\python.exe -m pip install $wheel
          & .wheel-venv\Scripts\python.exe -m pip check
          & .wheel-venv\Scripts\python.exe -m visualact_r --help
          & .wheel-venv\Scripts\python.exe -m visualact_r runtime-provenance --source-root $env:GITHUB_WORKSPACE --output runs/wheel_runtime_provenance.json
          & .wheel-venv\Scripts\python.exe -m visualact_r write-config --template qwen_qlora --output runs/wheel_qwen_qlora.yaml
          & .wheel-venv\Scripts\visualact-r.exe fixture-run --output runs/wheel_fixture_windows
          & .wheel-venv\Scripts\visualact-r.exe qualify --run-dir runs/wheel_fixture_windows
          python -m venv .sdist-venv
          & .sdist-venv\Scripts\python.exe -m pip install --upgrade pip
          & .sdist-venv\Scripts\python.exe -m pip install $sdist
          & .sdist-venv\Scripts\python.exe -m pip check
          & .sdist-venv\Scripts\python.exe -m visualact_r --help
          & .sdist-venv\Scripts\python.exe -m visualact_r runtime-provenance --source-root $env:GITHUB_WORKSPACE --output runs/sdist_runtime_provenance.json
          & .sdist-venv\Scripts\visualact-r.exe fixture-run --output runs/sdist_fixture_windows
          & .sdist-venv\Scripts\visualact-r.exe qualify --run-dir runs/sdist_fixture_windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-validation-artifacts
          path: |
            runs/ci_fixture_windows
            runs/wheel_fixture_windows
            runs/sdist_fixture_windows
            runs/wheel_runtime_provenance.json
            runs/sdist_runtime_provenance.json
            dist
          if-no-files-found: warn
          retention-days: 14
