name: Temporary mechanical Ruff cleanup
on:
  push:
    branches:
      - chore/readme-technical-focus-20261013
    paths:
      - .github/workflows/_temporary_ruff_cleanup.yml
permissions:
  contents: write
jobs:
  apply-autofixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned project lint tooling
        run: python -m pip install "ruff==0.14.0"
      - name: Apply safe mechanical fixes only
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --fix --exit-zero
          ruff format .
          git diff --stat
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Apply safe Ruff lint and formatting fixes"
            git push origin HEAD:refs/heads/chore/readme-technical-focus-20261013
          fi
          ruff check . || true
